<!-- Android adaptive foreground: the glyph only, on transparency.

     Scaled to 0.64 of the canvas — the same fraction as the flat tile — and
     deliberately NOT pre-inset for the mask's safe zone. flutter_launcher_icons
     wraps this drawable in android:inset="16%", which already does that job;
     insetting here too would shrink the glyph twice and leave it swimming in
     the middle of the icon. -->
