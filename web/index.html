<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your digital sales ledger.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#E5A21C">
  <meta name="apple-mobile-web-app-title" content="ProsperFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ProsperFlow</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    The web build is a design preview: it keeps data in memory and exists to
    show the build that was just deployed. Flutter's generated service worker
    is cache-first for main.dart.js, and the worker controlling a page is
    always the one registered on the *previous* visit — so the first load after
    a deploy serves the previous bundle, and only the load after that picks up
    the new one. That made a shipped change (thousands separators while typing
    a price) look like it had never landed.

    So: don't register the service worker, and clear anything an earlier visit
    left behind — a registration from before this change would otherwise keep
    serving its cached bundle indefinitely.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) registration.unregister();
      });
    }
    if (window.caches) {
      caches.keys().then((keys) => {
        for (const key of keys) caches.delete(key);
      });
    }
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    // Loading without serviceWorkerSettings skips registration entirely.
    _flutter.loader.load();
  </script>
</body>
</html>
