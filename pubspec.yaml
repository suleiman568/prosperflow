name: prosperflow
description: "ProsperFlow — digital sales ledger for Nigerian market traders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  drift: 2.26.1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.5.3
  sqlite3_flutter_libs: 0.5.34
  supabase_flutter: ^2.16.0
  connectivity_plus: ^7.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  csv: ^6.0.0
  share_plus: ^12.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqlite3: ^2.9.4
  drift_dev: 2.26.1
  build_runner: 2.4.15
  flutter_launcher_icons: ^0.14.4

# App icons, generated from assets/brand/*.svg via
# `node tool/render_brand_icons.js && dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/brand/app_icon.png
  android: true
  ios: true
  # iOS masks with its own superellipse and rejects alpha, so it gets the
  # square, fully opaque tile rather than the pre-rounded one.
  image_path_ios: assets/brand/app_icon_ios.png
  remove_alpha_ios: true
  # Adaptive icons are two layers the system masks together: flat ink behind,
  # glyph in front, already inset for the mask's safe zone.
  adaptive_icon_background: "#17150F"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#17150F"
    theme_color: "#E5A21C"

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900

    # The brand face (Identity Spec §03). SIL Open Font License 1.1 —
    # see assets/fonts/FamiljenGrotesk-OFL.txt. One weight only: the spec
    # forbids splitting the wordmark across weights.
    - family: FamiljenGrotesk
      fonts:
        - asset: assets/fonts/FamiljenGrotesk-SemiBold.ttf
          weight: 600
